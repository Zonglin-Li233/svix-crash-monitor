[project]
name = "Zonglin Li's HW3 SVIX Monitor History"
description = "Public derived daily SVIX and option-implied crash probabilities from the FINM 32800 HW3 monitor, committed for reproducible ChartBook dependencies."
repo_url = "https://github.com/Zonglin-Li233/svix-crash-monitor"

[dataframes.svix_monitor_history]
name = "Daily SVIX and Crash Probability History"
description = "One row per trading session with fixed 30-day SVIX, FRED VIX, and crash probabilities at the selected option expiry."
path = "svix_monitor_history.csv"
date_col = "date"
docs = """
This CSV contains derived statistics computed by the HW3 monitor's
src/monitor.py on the main branch, together with public FRED VIX observations.
It contains no raw option settlement records. The daily workflow appends
missing sessions and fills late VIX observations on monitor-history.

Each row is identified by date, the trading session. near_expiry and
far_expiry, with days_near and days_far, identify the expirations used to
construct SVIX. svix2_near and svix2_far are annualized simple variance
rates; svix2_30 is the annualized variance at a fixed 30-day target, and
svix_30 = 100 * sqrt(svix2_30) is annualized volatility in percent.
forward_near is inferred from put-call parity, not a raw security price or
a continuous return series. rate is the risk-free rate as a decimal.

Crash probabilities use the selected expiry closest to one month, with
its actual horizon recorded in days_used; they are not fixed 30-day
probabilities. Changes in days_used, including expiry switches, must be
considered when comparing dates. p_star_20 and p_star_10 are risk-neutral
probabilities of a 20% and 10% decline; p_log_20 and p_log_10 apply the log
investor correction; p_power_20 uses power utility with risk aversion 2.
Probabilities are decimal fractions, not percentages. They describe
option-implied pricing and model-dependent beliefs, not validated forecasts
of realized crashes. vix is the public FRED VIXCLS close in annualized
volatility percent; an empty value means the observation was not yet
available and must not be treated as zero.

The branch is a data-only ChartBook upstream with no build step. Pin its
commit and file hash to reproduce a report: the committed CSV's maximum
date determines that snapshot's cutoff. A later workflow commit can add
sessions or fill missing VIX, but a pinned snapshot remains unchanged.
The sample is short; use it for descriptive comparisons, not forecast
accuracy or causal claims. Method references are Martin (2017), What Is
the Expected Return on the Market?, and Martin and Shi (2025), Forecasting
Crashes with a Smile.
"""
